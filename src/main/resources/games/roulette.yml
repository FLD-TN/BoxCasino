# Vòng Quay. Bố cục khớp texture roulette_gui của pack iavegasgui: vòng 16 ô quanh bánh xe 5x5.
# Không sửa dòng này (bản plugin mới có số cao hơn thì file cũ được chuyển vào old-configs/).
config-version: 4
enabled: true
title: '&f:offset_-48:&f{img:iavegasgui:roulette_gui}'
fallback-title: '&#F78FB3Vòng Quay'
rows: 5

# Tỉ lệ (weight) tính bằng %. Phần còn lại là các ô trống (x0).
# RTP mỗi độ khó = (tỉ lệ ô thắng x hệ số + tổng tỉ lệ ô thưởng x hệ số) / 100. Mặc định đều 95%.
difficulties:
  easy:
    weight: 31
    multiplier: 2.4
    slot: 16
    inactive: {item: 'iavegasgui:roulette_button_easy_1', material: STICK, cmd: 5610101}
    active: {item: 'iavegasgui:roulette_button_easy_2', material: STICK, cmd: 5610102}
  medium:
    weight: 15.5
    multiplier: 4.8
    slot: 25
    inactive: {item: 'iavegasgui:roulette_button_medium_1', material: STICK, cmd: 5610103}
    active: {item: 'iavegasgui:roulette_button_medium_2', material: STICK, cmd: 5610104}
  hard:
    weight: 7.44
    multiplier: 10
    slot: 34
    inactive: {item: 'iavegasgui:roulette_button_hard_1', material: STICK, cmd: 5610105}
    active: {item: 'iavegasgui:roulette_button_hard_2', material: STICK, cmd: 5610106}

# Ô thưởng: index = vị trí trong slots.ring (0 = ô đầu). label-slot = ô bên trong để rê chuột xem.
bonus:
  left: {index: 4, weight: 8, multiplier: 1.0, label-slot: 19}
  bottom: {index: 8, weight: 6, multiplier: 1.5, label-slot: 29}
  right: {index: 12, weight: 6, multiplier: 0.6, label-slot: 21}

# Ô thắng (index trong slots.ring).
win-index: 0
# Số vòng chạy trước khi dừng, thời gian giữ kết quả.
laps: 3
reset-ticks: 40

bet:
  MONEY: {min: 1000, max: 1000000}
  GEM: {min: 1, max: 1000}

slots:
  bet: 14
  currency: 32
  info: 23
  spot: 11
  lever: 20
  ring: [2, 1, 0, 9, 18, 27, 36, 37, 38, 39, 40, 31, 22, 13, 4, 3]

items:
  bet: {item: 'iavegasgui:roulette_money_bet', material: STICK, cmd: 5610110}
  # Nút đổi tiền tệ: icon Tiền / Gem của server (item ItemsAdder treasure:money_item / treasure:gem_item).
  currency-money: {item: 'treasure:money_item', material: PAPER, cmd: 0}
  currency-gem: {item: 'treasure:gem_item', material: PAPER, cmd: 0}
  info: {item: 'iavegasgui:roulette_info', material: STICK, cmd: 5610109}
  spot: {item: 'iavegasgui:empty_button', material: STICK, cmd: 5600000}
  label: {item: 'iavegasgui:empty_button', material: STICK, cmd: 5600000}
  cell-a: {item: 'iavegasgui:roulette_red_square', material: STICK, cmd: 5610107}
  cell-b: {item: 'iavegasgui:roulette_black_square', material: STICK, cmd: 5610108}
