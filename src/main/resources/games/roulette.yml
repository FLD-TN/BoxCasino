# Roulette (bánh xe châu Âu 37 số, 1 số 0). Bố cục khớp texture roulette_gui của pack iavegasgui: vòng 16 ô quanh
# bánh xe 5x5, cột phải là bảng cược.
# Không sửa dòng này (bản plugin mới có số cao hơn thì file cũ được chuyển vào old-configs/).
config-version: 4
enabled: true
title: '&f:offset_-48:&f{img:iavegasgui:roulette_gui}'
fallback-title: '&#F78FB3Roulette'
rows: 5

# 3 cửa: Đỏ, Đen (18 số mỗi màu) và Xanh (chỉ số 0). Hệ số tính cả tiền cược.
# Mặc định đều hoàn trả 97,3%: Đỏ / Đen x2 (18/37), Xanh x36 (1/37). Ra số 0 thì Đỏ và Đen đều thua.
payouts:
  color: 2
  green: 36
# Tối đa đặt vào ô Xanh mỗi ván (0 = không giới hạn). Tổng cược 1 ván theo bet.max bên dưới.
max-green:
  MONEY: 100000
  GEM: 100

# Ô kim chỉ (index trong slots.ring, 0 = ô đầu): số nằm ở ô này khi dừng là số thắng.
win-index: 0
# Bánh xe quay thẳng tới số trúng; spin-laps = số vòng quay thêm trước đó (0 = không quay thêm).
spin-laps: 0

bet:
  MONEY: {min: 1000, max: 1000000}
  GEM: {min: 1, max: 1000}

slots:
  # Cột phải: mức cược, tiền tệ, luật chơi và 3 ô cược Đỏ / Đen / Xanh
  bet: 14
  currency: 32
  info: 23
  red: 16
  black: 25
  green: 34
  # Giữa vòng: số vừa ra, nút quay, 7 số ra gần nhất
  spot: 11
  lever: 20
  history: [10, 12, 19, 21, 28, 29, 30]
  ring: [2, 1, 0, 9, 18, 27, 36, 37, 38, 39, 40, 31, 22, 13, 4, 3]

items:
  bet: {item: 'iavegasgui:roulette_money_bet', material: STICK, cmd: 5610110}
  # Nút đổi tiền tệ: icon Tiền / Gem của server (item ItemsAdder treasure:money_item / treasure:gem_item).
  currency-money: {item: 'treasure:money_item', material: PAPER, cmd: 0}
  currency-gem: {item: 'treasure:gem_item', material: PAPER, cmd: 0}
  info: {item: 'iavegasgui:roulette_info', material: STICK, cmd: 5610109}
  spot: {item: 'iavegasgui:empty_button', material: STICK, cmd: 5600000}
  # 3 ô cược (ô của pack Vegas Double Roulette)
  red: {item: 'iavegasgui:doubleroulette_red_rolling_block', material: STICK, cmd: 5626106}
  black: {item: 'iavegasgui:doubleroulette_black_rolling_block', material: STICK, cmd: 5626105}
  green: {item: 'iavegasgui:doubleroulette_green_rolling_block', material: STICK, cmd: 5626107}
  # Ô số 0-36 trên vòng: mặc định boxcasino:roulette_<số> (pack boxcasino).
