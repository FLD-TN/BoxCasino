# Kim Tự Tháp (Plinko). Bố cục khớp texture pyramid_gui của pack iavegasgui: bóng thả từ ô 4, 5 phễu ở hàng dưới.
# Không sửa dòng này (bản plugin mới có số cao hơn thì file cũ được chuyển vào old-configs/).
config-version: 5
enabled: true
title: '&f:offset_-48:&f{img:iavegasgui:pyramid_gui}'
fallback-title: '&#F9D56EKim Tự Tháp'
rows: 6

# Bóng nảy trái / phải 50-50 ở mỗi hàng chốt (4 hàng), rơi vào phễu dưới cột cuối cùng, như Plinko thật.
# Tỉ lệ rơi 5 phễu (trái -> phải): 6,25% / 25% / 37,5% / 25% / 6,25%. Biên hiếm nhưng thưởng to, giữa hay rơi nhưng thấp.
# Mỗi mức rủi ro một bảng hệ số (5 phễu, trái -> phải). Hoàn trả = tổng (tỉ lệ x hệ số), mặc định đều 95%:
#   low:    x2   / x1.1  / x0.4 -> 62,5% số lần có lãi
#   medium: x3   / x0.85 / x0.4 -> 12,5% có lãi (biên x3)
#   high:   x5   / x0.5  / x0.2 -> 12,5% có lãi (biên x5)
# Đổi xong hãy kiểm tra bằng: /casino admin simulate plinko 2000000
# slot = ô nút chọn mức trên hàng trên cùng; inactive / active = hình nút khi chưa chọn / đang chọn.
risks:
  low:
    slot: 5
    multipliers: [2.0, 1.1, 0.4, 1.1, 2.0]
    inactive: {item: 'iavegasgui:minesweeper_button_easy_1', material: STICK, cmd: 5625106}
    active: {item: 'iavegasgui:minesweeper_button_easy_2', material: STICK, cmd: 5625107}
  medium:
    slot: 6
    multipliers: [3.0, 0.85, 0.4, 0.85, 3.0]
    inactive: {item: 'iavegasgui:minesweeper_button_medium_1', material: STICK, cmd: 5625108}
    active: {item: 'iavegasgui:minesweeper_button_medium_2', material: STICK, cmd: 5625109}
  high:
    slot: 7
    multipliers: [5.0, 0.5, 0.2, 0.5, 5.0]
    inactive: {item: 'iavegasgui:minesweeper_button_hard_1', material: STICK, cmd: 5625110}
    active: {item: 'iavegasgui:minesweeper_button_hard_2', material: STICK, cmd: 5625111}

# Tốc độ bóng (tick mỗi bước) và thời gian giữ kết quả.
step-ticks: 5
reset-ticks: 20

bet:
  MONEY: {min: 1000, max: 1000000}
  GEM: {min: 1, max: 1000}

slots:
  bet: 0
  currency: 17
  info: 8
  spot: 4
  hoppers: [45, 47, 49, 51, 53]

items:
  bet: {item: 'iavegasgui:pyramid_money_bet', material: STICK, cmd: 5614104}
  # Nút đổi tiền tệ: icon Tiền / Gem của server (item ItemsAdder treasure:money_item / treasure:gem_item).
  currency-money: {item: 'treasure:money_item', material: PAPER, cmd: 0}
  currency-gem: {item: 'treasure:gem_item', material: PAPER, cmd: 0}
  info: {item: 'iavegasgui:pyramid_info', material: STICK, cmd: 5614103}
  spot: {item: 'iavegasgui:pyramid_bet', material: STICK, cmd: 5614102}
  ball: {item: 'iavegasgui:pyramid_ball', material: STICK, cmd: 5614101}
  hopper: {item: 'iavegasgui:empty_button', material: STICK, cmd: 5600000}
