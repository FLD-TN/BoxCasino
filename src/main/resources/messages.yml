  busy-match: '&#FF6B6B✘ Bạn đang có ván chưa xong &7- mỗi lần chỉ chơi 1 game'
  busy-challenge: '&#FF6B6B✘ Bạn đang có kèo {game} chờ người nhận &7- huỷ kèo đó để chơi game khác &8(&e/casino pvp cancel {id}&8)'
