# Toàn bộ chữ hiển thị của BoxCasino. Mã màu '&' và hex '&#rrggbb'.
# Viết theo chuẩn BoxCore / BoxClans:
#   - Tên game viết hoa từng chữ, mỗi game một màu riêng. Tên khác viết hoa chữ đầu. Không in đậm.
#   - Thẻ phụ trong ngoặc tối: &8[...&8]
#   - Lore: dòng mô tả (&#BFC7D5), mục "Thông tin:" / "Lưu ý:" (&#FFD166), dòng "&7• Nhãn: giá trị",
#     cuối cùng là các thao tác dạng &8[&#7CFC9AChuột trái để ...&8]
#   - Tin nhắn: ✔ thành công (&#7CFC9A), ✘ lỗi (&#FF6B6B), (!) chú ý (&#FFD166), không chấm cuối câu
#   - Tiền &#55FF55, Gem &#8245F8, hệ số &#FFD166, giá trị &f
# Màu riêng: Dò Mìn #FF8A65, Kim Tự Tháp #F9D56E, Leo Thang #FFB86B, Roulette #F78FB3, Đua Ngựa #7BED9F,
#            Xì Dách #70A1FF, Nhà Cái #E056FD, Xúc Xắc #FFDD59, Oẳn Tù Tì #CF9FFF, Cờ Caro #5EE7DF
# %img_money% / %img_gem% = icon ItemsAdder (cần PlaceholderAPI). Đặt &f trước icon để icon giữ đúng màu.
# Để trống ('') một tin nhắn chat = không gửi tin đó.

# Không sửa dòng này (bản plugin mới có số cao hơn thì file cũ được chuyển vào old-configs/).
config-version: 9

